name: Sync calendar data
on:
  schedule:
    - cron: "30 9 * * 1"   # Mondays 09:30 UTC (~02:30 Vancouver)
  workflow_dispatch:
  push:
    paths: ["scripts/*.mjs", "beer-links.json"]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build calendar-data.js from the events sheet
        env:
          CALENDAR_SHEET_CSV_URL: ${{ vars.CALENDAR_SHEET_CSV_URL }}
        run: node scripts/build-calendar-data.mjs
      - name: Validate
        run: node scripts/validate-links.mjs
      - name: Commit if changed
        run: |
          git config user.name "superflux-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add calendar-data.js
          git diff --cached --quiet && exit 0
          git commit -m "Update calendar data $(date -u +%F)"
          git push
