name: Sync calendar data
on:
  schedule:
    - cron: "0 * * * *"   # hourly — keeps the rolling three-month window current, and watches for a stalled sheet push
  workflow_dispatch:
  repository_dispatch:
    types: [sheet-heartbeat]   # sent by apps-script/PushCalendarCsv.gs on every successful run
  push:
    paths: ["scripts/*.mjs", "beer-links.json", "data/events.csv"]
concurrency:
  group: sync-calendar-data
  cancel-in-progress: false
permissions:
  contents: write
  actions: read   # check-freshness reads past heartbeat runs
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build calendar-data.js from data/events.csv
        run: node scripts/build-calendar-data.mjs
      - name: Validate
        run: node scripts/validate-links.mjs
      - name: Commit if changed
        run: |
          git config user.name "superflux-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add calendar-data.js
          git diff --cached --quiet && exit 0
          git commit -m "Update calendar data $(date -u +%F)"
          git pull --rebase --quiet
          git push
      # Runs even when the build failed, so a stale input is named as the cause. "No change" above
      # is only a success if the sheet has actually confirmed the input recently.
      - name: Check the sheet push is alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-freshness.mjs
