name: Sync calendar data
on:
  schedule:
    - cron: "0 * * * *"   # hourly — keeps the rolling three-month window current
  workflow_dispatch:
  push:
    paths: ["scripts/*.mjs", "beer-links.json", "data/events.csv"]
concurrency:
  group: sync-calendar-data
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build calendar-data.js from data/events.csv
        run: node scripts/build-calendar-data.mjs
      - name: Validate
        run: node scripts/validate-links.mjs
      - name: Commit if changed
        run: |
          git config user.name "superflux-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add calendar-data.js
          git diff --cached --quiet && exit 0
          git commit -m "Update calendar data $(date -u +%F)"
          git pull --rebase --quiet
          git push
