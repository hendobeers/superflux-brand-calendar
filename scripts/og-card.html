<!doctype html><meta charset="utf-8">
<style>
  @font-face { font-family:"Founders Grotesk"; src:url("../assets/founders-grotesk-web-regular.woff2") format("woff2"); font-weight:400; }
  @font-face { font-family:"Founders Grotesk"; src:url("../assets/founders-grotesk-web-medium.woff2") format("woff2"); font-weight:500; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; background:#fff; color:#000;
         font-family:"Founders Grotesk", Montserrat, sans-serif;
         display:flex; flex-direction:column; padding:58px 72px; }
  .top { display:flex; align-items:center; gap:28px; }
  .top img { width:104px; height:104px; display:block; }
  .eyebrow { font-size:19px; font-weight:500; text-transform:uppercase; letter-spacing:0.2em; }
  .rule { border-top:4px solid #000; margin:38px 0 0; }
  .mid { flex:1; display:flex; flex-direction:column; justify-content:center; }
  h1 { font-size:96px; font-weight:500; text-transform:uppercase; letter-spacing:0.15em;
       line-height:0.98; text-indent:0.15em; }
  .sub { margin-top:24px; font-size:25px; font-weight:400; line-height:1.35; max-width:800px; }
  .legend { display:flex; flex-wrap:wrap; gap:10px 22px; align-items:center; padding-top:26px; border-top:1px solid #000; }
  .k { display:flex; align-items:center; gap:8px; font-size:16px; font-weight:500; white-space:nowrap; }
  .sw { width:16px; height:16px; }
</style>
<div class="top">
  <img src="../assets/badge.svg">
  <div class="eyebrow">Superflux&nbsp;&nbsp;·&nbsp;&nbsp;505 Clark Drive</div>
</div>
<div class="rule"></div>
<div class="mid">

  <div class="sub">Every release, tap takeover, wholesale LTO and food feature — a rolling three months, updated weekly.</div>
</div>

  <div class="k"><span class="sw" style="background:#E8378A"></span>Heavy Fruit</div>
  <div class="k"><span class="sw" style="background:#F2C230"></span>The Creamery</div>
  <div class="k"><span class="sw" style="background:#2FA86B"></span>Collab</div>
  <div class="k"><span class="sw" style="background:#7A4BD9"></span>New release</div>
  <div class="k"><span class="sw" style="background:#F8BDD7"></span>Wholesale $1 LTO</div>
  <div class="k"><span class="sw" style="background:#000"></span>Food</div>
